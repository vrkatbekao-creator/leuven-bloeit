<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leuven Bloeit — Flower Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
/* ── TOKENS ── */
:root{
  --cream:#FAF6EF;--petal:#E8A0B0;--petal-dark:#C4607A;--petal-light:#F5D0D9;
  --green:#4A7C59;--green-light:#D4EAD8;--amber:#D4882A;--amber-light:#F5E0B8;
  --ink:#1E1A16;--ink-muted:#6B5E52;--ink-faint:#BFB5AA;
  --white:#FFFFFF;--border:rgba(30,26,22,.10);
  --info-bg:#EAF3FB;--info:#1A6FAA;
  --success-bg:#D4EAD8;--success:#2E6640;
  --danger-bg:#FAE0E0;--danger:#B03030;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;overflow-x:hidden;}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:1000;background:var(--cream);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px;}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap;}
.logo-bloom{width:30px;height:30px;background:var(--petal-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;}
.header-center{display:flex;gap:3px;}
.nav-tab{padding:6px 13px;border-radius:8px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink-muted);cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;}
.nav-tab:hover{background:rgba(30,26,22,.06);}
.nav-tab.active{background:var(--ink);color:var(--white);font-weight:500;}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.weather-chip{display:flex;align-items:center;gap:6px;padding:5px 11px;background:var(--white);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--ink-muted);white-space:nowrap;}
.weather-chip b{font-weight:500;color:var(--ink);}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.season-badge{padding:4px 11px;background:var(--petal-light);color:var(--petal-dark);border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;}
.lang-switcher{display:flex;gap:2px;background:var(--cream);border:1px solid var(--border);border-radius:20px;padding:3px;}
.lang-btn{padding:3px 8px;border-radius:14px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;color:var(--ink-muted);cursor:pointer;transition:background .15s,color .15s;}
.lang-btn.active{background:var(--ink);color:var(--white);}

/* ── HERO ── */
.hero{padding:18px 24px 0;display:flex;align-items:flex-end;justify-content:space-between;}
.hero-title{font-family:'Playfair Display',serif;font-size:clamp(22px,4vw,36px);font-weight:600;line-height:1.15;color:var(--ink);}
.hero-title em{font-style:italic;color:var(--petal-dark);}
.hero-sub{font-size:13px;color:var(--ink-muted);margin-top:5px;}
.hero-stats{display:flex;gap:20px;padding-bottom:4px;}
.stat{text-align:right;}
.stat-num{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;color:var(--ink);line-height:1;}
.stat-label{font-size:11px;color:var(--ink-muted);margin-top:2px;}

/* ── MAP LAYOUT ── */
.layout{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 60px - 80px);min-height:440px;}
@media(max-width:760px){
  .layout{grid-template-columns:1fr;grid-template-rows:1fr 280px;}
  .sidebar{order:2;border-right:none;border-top:1px solid var(--border);max-height:280px;}
  #map{order:1;}
  .season-badge{display:none;}
}
.sidebar{border-right:1px solid var(--border);overflow-y:auto;background:var(--white);scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.sidebar-section{padding:14px 18px;border-bottom:1px solid var(--border);}
.sidebar-section:last-child{border-bottom:none;}
.section-label{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;}

/* ── FLOWER CARDS ── */
.flower-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:3px;animation:fadeIn .4s ease both;}
.flower-card:hover,.flower-card.active{background:var(--cream);}
.flower-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.flower-info{flex:1;min-width:0;}
.flower-name{font-size:13px;font-weight:500;color:var(--ink);}
.flower-loc{font-size:11px;color:var(--ink-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pill{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:500;flex-shrink:0;}
.pill-peak{background:var(--petal-light);color:var(--petal-dark);}
.pill-soon{background:var(--amber-light);color:var(--amber);}
.pill-fading{background:var(--green-light);color:var(--green);}
.pill-ended{background:#EEEBE6;color:var(--ink-faint);}
.pill-foliage{background:#FDE8CC;color:#A0440A;}
.marker-foliage{background:#D4610A;}

/* ── WEATHER ── */
.weather-row{display:flex;gap:7px;}
.weather-card{flex:1;background:var(--cream);border-radius:10px;padding:9px;text-align:center;}
.weather-val{font-size:17px;font-weight:500;color:var(--ink);}
.weather-key{font-size:10px;color:var(--ink-faint);margin-top:2px;}

/* ── WEEKLY STRIP ── */
.cal-strip{display:flex;gap:3px;align-items:flex-end;height:44px;margin-bottom:4px;}
.cal-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.cal-bar-wrap{width:100%;flex:1;display:flex;align-items:flex-end;}
.cal-bar-inner{width:100%;border-radius:3px 3px 0 0;}
.cal-month-label{font-size:9px;color:var(--ink-faint);margin-top:1px;}
.cal-now{border-top:2px solid var(--petal-dark);}

/* ── COMMUNITY REPORT CARDS ── */
.report-card{display:flex;gap:10px;padding:9px 10px;border-radius:10px;margin-bottom:4px;background:var(--cream);}
.report-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--petal-light);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;}
.report-thumb img{width:100%;height:100%;object-fit:cover;}
.report-info{flex:1;min-width:0;}
.report-loc{font-size:12px;font-weight:500;color:var(--ink);}
.report-meta{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.report-note{font-size:11px;color:var(--ink-muted);margin-top:3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* ── iNAT TOGGLE ── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-muted);}
.toggle{width:34px;height:19px;background:var(--border);border-radius:10px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:none;}
.toggle.on{background:var(--green);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;background:white;border-radius:50%;transition:transform .2s;}
.toggle.on::after{transform:translateX(15px);}

/* ── MAP ── */
#map{z-index:1;}
.leaflet-container{background:#E8EFE0 !important;}
.marker-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.marker-circle{width:34px;height:34px;border-radius:50%;border:2.5px solid white;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .15s;}
.marker-circle:hover{transform:scale(1.15);}
.marker-peak{background:var(--petal);}
.marker-soon{background:#F0C060;}
.marker-fading{background:#8FBF9A;}
.marker-ended{background:#C8C4BC;}
.marker-tip{background:white;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:500;color:var(--ink);margin-top:2px;box-shadow:0 1px 4px rgba(0,0,0,.12);white-space:nowrap;}
.marker-inat{width:22px;height:22px;border-radius:50%;background:#2E6640;border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 1px 5px rgba(0,0,0,.2);cursor:pointer;}

/* ── POPUP ── */
.leaflet-popup-content-wrapper{border-radius:14px !important;box-shadow:0 4px 20px rgba(0,0,0,.12) !important;padding:0 !important;overflow:hidden;font-family:'DM Sans',sans-serif !important;}
.leaflet-popup-content{margin:0 !important;width:230px !important;}
.leaflet-popup-tip-container{display:none;}
.popup-inner{padding:15px;}
.popup-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.popup-icon{font-size:22px;}
.popup-title{font-family:'Playfair Display',serif;font-size:14px;font-weight:600;}
.popup-subtitle{font-size:11px;color:var(--ink-muted);}
.popup-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border);}
.popup-row:last-of-type{border-bottom:none;}
.popup-key{color:var(--ink-muted);}
.popup-val{font-weight:500;text-align:right;max-width:135px;}
.popup-tip{font-size:11px;color:var(--ink-muted);margin-top:8px;line-height:1.5;}
.popup-btn{display:block;width:100%;margin-top:10px;padding:8px;background:var(--ink);color:var(--white);border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;text-align:center;text-decoration:none;transition:opacity .15s;}
.popup-btn:hover{opacity:.8;}
.popup-report-btn{display:block;width:100%;margin-top:6px;padding:7px;background:var(--petal-light);color:var(--petal-dark);border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;text-align:center;transition:opacity .15s;}
.popup-report-btn:hover{opacity:.8;}

/* ── FOOTER ── */
.footer-strip{height:28px;background:var(--white);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:14px;font-size:11px;color:var(--ink-faint);}
.footer-dot{width:5px;height:5px;border-radius:50%;}
.footer-item{display:flex;align-items:center;gap:5px;}

/* ── LOADING ── */
#loading{position:fixed;inset:0;z-index:9999;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s;}
#loading.hidden{opacity:0;pointer-events:none;}
.loading-title{font-family:'Playfair Display',serif;font-size:30px;font-style:italic;color:var(--ink);}
.loading-bar{width:150px;height:2px;background:var(--border);border-radius:2px;overflow:hidden;}
.loading-fill{height:100%;width:0;background:var(--petal-dark);border-radius:2px;animation:load 1.6s ease forwards;}
@keyframes load{to{width:100%;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── ABOUT CARDS ── */
.about-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:18px;}
.about-card-icon{font-size:22px;margin-bottom:7px;}
.about-card-title{font-weight:500;margin-bottom:4px;font-size:14px;}
.about-card-desc{font-size:12px;color:var(--ink-muted);line-height:1.6;}

/* ── REPORT FORM (full tab) ── */
.report-layout{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 60px);gap:0;}
@media(max-width:760px){.report-layout{grid-template-columns:1fr;}}
.report-form-col{padding:32px 32px;border-right:1px solid var(--border);overflow-y:auto;}
.report-feed-col{padding:24px 24px;background:var(--white);overflow-y:auto;}
.form-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;margin-bottom:6px;}
.form-sub{font-size:13px;color:var(--ink-muted);margin-bottom:24px;line-height:1.6;}
.form-group{margin-bottom:18px;}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--ink-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.form-select,.form-input,.form-textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--white);transition:border .15s;}
.form-select:focus,.form-input:focus,.form-textarea:focus{outline:none;border-color:var(--petal-dark);}
.form-textarea{resize:vertical;min-height:80px;line-height:1.5;}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.status-option{padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;font-size:13px;font-weight:500;transition:all .15s;}
.status-option:hover{border-color:var(--petal-dark);}
.status-option.selected{border-color:var(--petal-dark);background:var(--petal-light);color:var(--petal-dark);}
.status-option.selected.s-soon{border-color:var(--amber);background:var(--amber-light);color:var(--amber);}
.status-option.selected.s-fading{border-color:var(--green);background:var(--green-light);color:var(--green);}
.status-option.selected.s-ended{border-color:var(--ink-faint);background:#EEEBE6;color:var(--ink-faint);}
.status-option.selected.s-foliage{border-color:#A0440A;background:#FDE8CC;color:#A0440A;}
.photo-drop{border:1.5px dashed var(--border);border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:border .15s;background:var(--cream);}
.photo-drop:hover,.photo-drop.dragover{border-color:var(--petal-dark);}
.photo-drop-icon{font-size:28px;margin-bottom:8px;}
.photo-drop-text{font-size:13px;color:var(--ink-muted);}
.photo-drop-hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}
.photo-previews{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.photo-preview-item{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;}
.photo-preview-item img{width:100%;height:100%;object-fit:cover;}
.photo-remove{position:absolute;top:3px;right:3px;width:18px;height:18px;background:rgba(0,0,0,.5);border-radius:50%;color:white;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;}
.submit-btn{width:100%;padding:13px;background:var(--ink);color:var(--white);border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:opacity .15s;margin-top:8px;}
.submit-btn:hover{opacity:.85;}
.submit-btn:disabled{opacity:.4;cursor:not-allowed;}
.form-toast{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none;}
.toast-success{background:var(--success-bg);color:var(--success);}
.toast-error{background:var(--danger-bg);color:var(--danger);}

/* ── FIREBASE NOTICE ── */
.firebase-notice{background:var(--info-bg);border:1px solid #B5D4F4;border-radius:12px;padding:14px 16px;margin-bottom:20px;font-size:12px;color:var(--info);line-height:1.7;}
.firebase-notice strong{font-weight:500;}

/* ── SUBSCRIPTION ── */
.sub-box{background:var(--petal-light);border-radius:14px;padding:20px;margin-top:24px;}
.sub-title{font-weight:500;margin-bottom:4px;font-size:14px;color:var(--petal-dark);}
.sub-desc{font-size:12px;color:var(--ink-muted);margin-bottom:12px;line-height:1.6;}
.sub-row{display:flex;gap:8px;}
.sub-input{flex:1;padding:9px 12px;border:1px solid rgba(196,96,122,.3);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--white);}
.sub-input:focus{outline:none;border-color:var(--petal-dark);}
.sub-btn{padding:9px 16px;background:var(--petal-dark);color:var(--white);border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:opacity .15s;}
.sub-btn:hover{opacity:.85;}

/* ── INAT SECTION ── */
.inat-badge{display:inline-flex;align-items:center;gap:5px;background:var(--success-bg);color:var(--success);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500;margin-bottom:8px;}
</style>
</head>
<body>

<!-- ════════════════ LOADING ════════════════ -->
<div id="loading">
  <div style="font-size:34px;">🌸</div>
  <div class="loading-title">Leuven Bloeit</div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
  <div id="loading-sub" style="font-size:12px;color:var(--ink-muted);">Loading…</div>
</div>

<!-- ════════════════ HEADER ════════════════ -->
<header>
  <a href="#" class="logo"><div class="logo-bloom">🌸</div>Leuven Bloeit</a>
  <div class="header-center">
    <button class="nav-tab active" onclick="switchTab('map',this)" data-i18n="tab_map"></button>
    <button class="nav-tab" onclick="switchTab('calendar',this)" data-i18n="tab_calendar"></button>
    <button class="nav-tab" onclick="switchTab('report',this)" data-i18n="tab_report"></button>
    <button class="nav-tab" onclick="switchTab('about',this)" data-i18n="tab_about"></button>
  </div>
  <div class="header-right">
    <div class="weather-chip"><div class="wdot"></div><b id="hdr-temp">—°C</b><span id="hdr-desc" style="margin-left:2px;">…</span></div>
    <div class="season-badge" id="season-badge"></div>
    <div class="lang-switcher">
      <button class="lang-btn active" onclick="setLang('en',this)">EN</button>
      <button class="lang-btn" onclick="setLang('fr',this)">FR</button>
      <button class="lang-btn" onclick="setLang('nl',this)">NL</button>
      <button class="lang-btn" onclick="setLang('zh',this)">中</button>
    </div>
  </div>
</header>

<!-- ════════════════ MAP TAB ════════════════ -->
<div id="tab-map" class="tab-panel active">
  <div class="hero">
    <div>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-sub" id="hero-sub"></p>
    </div>
    <div class="hero-stats">
      <div class="stat"><div class="stat-num" id="stat-peak">—</div><div class="stat-label" id="stat-peak-lbl"></div></div>
      <div class="stat"><div class="stat-num" id="stat-soon">—</div><div class="stat-label" id="stat-soon-lbl"></div></div>
    </div>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="section-label" id="lbl-spots"></div>
        <div id="flower-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-label" id="lbl-community"></div>
        <div id="community-feed">
          <div style="font-size:12px;color:var(--ink-faint);padding:4px 0;" id="feed-empty"></div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="section-label" id="lbl-weather"></div>
        <div class="weather-row">
          <div class="weather-card"><div class="weather-val" id="w-temp">—</div><div class="weather-key" id="w-temp-lbl"></div></div>
          <div class="weather-card"><div class="weather-val" id="w-rain">—</div><div class="weather-key" id="w-rain-lbl"></div></div>
          <div class="weather-card"><div class="weather-val" id="w-wind">—</div><div class="weather-key" id="w-wind-lbl"></div></div>
        </div>
        <p style="font-size:10px;color:var(--ink-faint);margin-top:7px;" id="weather-source"></p>
      </div>
      <div class="sidebar-section">
        <div class="toggle-row">
          <div>
            <div class="section-label" style="margin-bottom:2px;" id="lbl-inat"></div>
            <div class="inat-badge" id="inat-count-badge">iNaturalist</div>
          </div>
          <button class="toggle on" id="inat-toggle" onclick="toggleInat(this)" title="Toggle iNaturalist"></button>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="section-label" id="lbl-week"></div>
        <div id="cal-strip" class="cal-strip"></div>
        <div style="display:flex;justify-content:space-between;margin-top:5px;">
          <span style="font-size:10px;color:var(--ink-faint);" id="day-start"></span>
          <span style="font-size:10px;color:var(--ink-faint);" id="day-today"></span>
          <span style="font-size:10px;color:var(--ink-faint);" id="day-end"></span>
        </div>
      </div>
    </aside>
    <div id="map"></div>
  </div>
  <div class="footer-strip">
    <div class="footer-item"><div class="footer-dot" style="background:var(--petal);"></div><span id="leg-peak"></span></div>
    <div class="footer-item"><div class="footer-dot" style="background:#F0C060;"></div><span id="leg-soon"></span></div>
    <div class="footer-item"><div class="footer-dot" style="background:#8FBF9A;"></div><span id="leg-fading"></span></div>
    <div class="footer-item"><div class="footer-dot" style="background:#C8C4BC;"></div><span id="leg-ended"></span></div>

function t(key) { return LANGS[currentLang][key] || LANGS.en[key] || key; }

function timeAgo(ts) {
  const diff = (Date.now() - ts) / 1000;
  const ta = LANGS[currentLang].time_ago;
  if (diff < 60)  return ta.just;
  if (diff < 3600) return Math.floor(diff/60) + ' ' + ta.min;
  if (diff < 86400) return Math.floor(diff/3600) + ' ' + ta.hr;
  if (diff < 172800) return '1 ' + ta.day;
  return Math.floor(diff/86400) + ' ' + ta.days;
}

/* Compress image to max 800px side, returns dataUrl */
function compressImage(file) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 800;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = url;
  });
}

function initMap() {
  map = L.map('map', {center:[50.876,4.700], zoom:14, zoomControl:true, attributionControl:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(map);
  L.control.attribution({prefix:false}).addTo(map);

  const mc = {peak:'marker-peak', soon:'marker-soon', fading:'marker-fading', ended:'marker-ended', foliage:'marker-foliage'};
  SPOTS.forEach(spot => {
    const html = `<div class="marker-wrap"><div class="marker-circle ${mc[spot.status]}">${spot.icon}</div><div class="marker-tip">${spot.name.nl}</div></div>`;
    const marker = L.marker([spot.lat, spot.lng], {
      icon: L.divIcon({className:'', html, iconSize:[90,58], iconAnchor:[45,58]})
    }).addTo(map);
    marker.bindPopup(makePopup(spot));
    leafletMarkers[spot.id] = marker;
  });
}

function makePopup(spot) {
  const L = LANGS[currentLang];
  return `<div class="popup-inner">
    <div class="popup-header">
      <div class="popup-icon">${spot.icon}</div>
      <div><div class="popup-title">${spot.name[currentLang]}</div><div class="popup-subtitle">${spot.name.nl}</div></div>
    </div>
    <div class="popup-row"><span class="popup-key">${L.popup_status}</span><span class="popup-val">${L.status[spot.status]}</span></div>
    <div class="popup-row"><span class="popup-key">${L.popup_flowers}</span><span class="popup-val">${spot.flowers[currentLang]}</span></div>
    <div class="popup-row"><span class="popup-key">${L.popup_best}</span><span class="popup-val">${spot.best[currentLang]}</span></div>
    <div class="popup-row"><span class="popup-key">${L.popup_hours}</span><span class="popup-val">${spot.hours[currentLang]}</span></div>
    <div class="popup-tip">💡 ${spot.tip[currentLang]}</div>
    <a class="popup-btn" href="${spot.gmaps}" target="_blank">${L.popup_gmaps}</a>
    <button class="popup-report-btn" onclick="openReportForSpot(${spot.id})">${L.popup_report}</button>
  </div>`;
}

function rebuildMapPopups() {
  SPOTS.forEach(spot => {
    if (leafletMarkers[spot.id]) leafletMarkers[spot.id].setPopupContent(makePopup(spot));
  });
}

function openReportForSpot(spotId) {
  // Switch to report tab and pre-select the location
  const reportTab = document.querySelector('[onclick*="report"]');
  switchTab('report', reportTab);
  const sel = document.getElementById('rpt-location');
  if (sel) sel.value = spotId;
  map.closePopup();
}

/* ════════════════════════════════════════════════════════════
   iNATURALIST
   ════════════════════════════════════════════════════════════ */
async function fetchInat() {
  try {
    const url = 'https://api.inaturalist.org/v1/observations?lat=50.876&lng=4.700&radius=4&taxon_name=Plantae&per_page=30&quality_grade=research&order_by=observed_on&photos=true';
    const res = await fetch(url);
    const d = await res.json();
    const obs = d.results || [];

    // Update badge
    const badge = document.getElementById('inat-count-badge');
    const count = d.total_results || obs.length;
    const L = LANGS[currentLang];
    badge.textContent = count + ' ' + (count === 1 ? L.inat_obs : L.inat_obs_pl);

    inatMarkers.forEach(m => map.removeLayer(m));
    inatMarkers = [];

    obs.forEach(ob => {
      if (!ob.location) return;
      const [lat, lng] = ob.location.split(',').map(Number);
      const taxon = ob.taxon?.preferred_common_name || ob.taxon?.name || 'Plant';
      const photo = ob.photos?.[0]?.url?.replace('square','small') || '';
      const date = ob.observed_on || '';
      const user = ob.user?.login || '?';
      const url2 = `https://www.inaturalist.org/observations/${ob.id}`;

      const icon = L.divIcon({
        className:'',
        html: `<div class="marker-inat">🌿</div>`,
        iconSize:[22,22], iconAnchor:[11,11]
      });
      const marker = L.marker([lat,lng], {icon}).addTo(map);
      marker.bindPopup(`<div class="popup-inner">
        <div class="popup-header">
          <div class="popup-icon">🌿</div>
          <div><div class="popup-title" style="font-size:13px;">${taxon}</div><div class="popup-subtitle">iNaturalist · ${date}</div></div>
        </div>
        ${photo ? `<img src="${photo}" style="width:100%;border-radius:8px;margin-bottom:8px;display:block;" loading="lazy">` : ''}
        <div class="popup-row"><span class="popup-key">Observer</span><span class="popup-val">${user}</span></div>
        <a class="popup-btn" href="${url2}" target="_blank">View on iNaturalist →</a>
      </div>`);
      inatMarkers.push(marker);
    });

    if (!inatVisible) inatMarkers.forEach(m => map.removeLayer(m));
  } catch(e) {
    console.warn('iNaturalist fetch failed:', e);
  }
}

function toggleInat(btn) {
  inatVisible = !inatVisible;
  btn.classList.toggle('on', inatVisible);
  inatMarkers.forEach(m => inatVisible ? map.addLayer(m) : map.removeLayer(m));
}

/* ════════════════════════════════════════════════════════════
   SIDEBAR
   ════════════════════════════════════════════════════════════ */
function buildSidebar() {
  const list = document.getElementById('flower-list');
  if (!list) return;
  const sp = {peak:'pill-peak', soon:'pill-soon', fading:'pill-fading', ended:'pill-ended', foliage:'pill-foliage'};
  const ib = {peak:'var(--petal-light)', soon:'var(--amber-light)', fading:'var(--green-light)', ended:'#EEEBE6', foliage:'#FDE8CC'};
  let peak=0, soon=0;

  const springSpots  = SPOTS.filter(s => s.status !== 'foliage');
  const foliageSpots = SPOTS.filter(s => s.status === 'foliage');

  list.innerHTML = '';

  function makeCard(spot, i, delay) {
    if (spot.status==='peak') peak++;
    if (spot.status==='soon') soon++;
    const card = document.createElement('div');
    card.className = 'flower-card';
    card.style.animationDelay = delay + 's';
    card.innerHTML = `
      <div class="flower-icon" style="background:${ib[spot.status]}">${spot.icon}</div>
      <div class="flower-info">
        <div class="flower-name">${spot.name[currentLang]}</div>
        <div class="flower-loc">${spot.flowers[currentLang]}</div>
      </div>
      <div class="pill ${sp[spot.status]}">${LANGS[currentLang].status[spot.status]}</div>`;
    card.onclick = () => {
      document.querySelectorAll('.flower-card').forEach(c=>c.classList.remove('active'));
      card.classList.add('active');
      map.setView([spot.lat,spot.lng], 16, {animate:true});
      leafletMarkers[spot.id].openPopup();
    };
    return card;
  }

  springSpots.forEach((spot,i) => list.appendChild(makeCard(spot, i, i*0.05)));

  if (foliageSpots.length > 0) {
    const divider = document.createElement('div');
    divider.style.cssText = 'margin:10px 0 6px;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#A0440A;';
    divider.setAttribute('id','lbl-foliage-inline');
    divider.textContent = LANGS[currentLang].leg_foliage || 'Autumn foliage';
    list.appendChild(divider);
    foliageSpots.forEach((spot,i) => list.appendChild(makeCard(spot, i, (springSpots.length+i)*0.05)));
  }

  document.getElementById('stat-peak').textContent = peak;
  document.getElementById('stat-soon').textContent = soon;
}

function renderCommunityFeed() {
  const feed = document.getElementById('community-feed');
  if (!feed) return;
  if (communityReports.length === 0) {
    feed.innerHTML = `<div style="font-size:12px;color:var(--ink-faint);padding:4px 0;">${t('feed_empty')}</div>`;
    return;
  }
  const recent = communityReports.slice(0, 4);
  feed.innerHTML = recent.map(r => {
    const spotName = SPOTS.find(s=>s.id===r.spotId)?.name[currentLang] || r.spotId;
    const thumb = r.photoUrl
      ? `<div class="report-thumb"><img src="${r.photoUrl}" alt=""></div>`
      : `<div class="report-thumb">${SPOTS.find(s=>s.id===r.spotId)?.icon||'🌸'}</div>`;
    const statusLabel = LANGS[currentLang].status[r.status] || r.status;
    return `<div class="report-card">
      ${thumb}
      <div class="report-info">
        <div class="report-loc">${spotName}</div>
        <div class="report-meta">${statusLabel} · ${timeAgo(r.ts)} · ${r.name || t('rpt_name_placeholder')}</div>
        ${r.note ? `<div class="report-note">${r.note}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════════════════════════
   WEEKLY STRIP
   ════════════════════════════════════════════════════════════ */
function buildCalStrip() {
  const strip = document.getElementById('cal-strip');
  if (!strip) return;
  const days = {en:['M','T','W','T','F','S','S'],fr:['L','M','M','J','V','S','D'],nl:['M','D','W','D','V','Z','Z'],zh:['一','二','三','四','五','六','日']}[currentLang];
  const vals = [62,70,78,85,88,75,60];
  const today = new Date().getDay();
  strip.innerHTML = '';
  vals.forEach((v,i) => {
    const isToday = i===((today+6)%7);
    const col = document.createElement('div');
    col.className = 'cal-col'+(isToday?' cal-now':'');
    col.innerHTML = `<div class="cal-bar-wrap" style="height:40px;"><div class="cal-bar-inner" style="height:${v}%;background:${isToday?'var(--petal-dark)':'var(--petal-light)'};"></div></div><div class="cal-month-label">${days[i]}</div>`;
    strip.appendChild(col);
  });
}

/* ════════════════════════════════════════════════════════════
   CALENDAR PAGE
   ════════════════════════════════════════════════════════════ */
function buildCalendar() {
  const grid = document.getElementById('calendar-grid');
  if (!grid) return;
  const now = new Date().getMonth();
  const months = {
    en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
    fr:['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'],
    nl:['Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Dec'],
    zh:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']
  }[currentLang];

  let html = `<div style="display:grid;grid-template-columns:130px 1fr;border:1px solid var(--border);border-radius:14px;overflow:hidden;">`;
  html += `<div style="background:var(--cream);padding:9px 14px;border-bottom:1px solid var(--border);font-size:10px;font-weight:500;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;">${t('tab_calendar')}</div>`;
  html += `<div style="background:var(--cream);padding:9px 0;border-bottom:1px solid var(--border);display:flex;">`;
  months.forEach((m,i) => {
    const isNow = i===now;
    html += `<div style="flex:1;text-align:center;font-size:10px;color:${isNow?'var(--petal-dark)':'var(--ink-faint)'};font-weight:${isNow?500:400};">${m}</div>`;
  });
  html += `</div>`;
  CALENDAR_DATA.forEach((item,idx) => {
    const bg = idx%2===0 ? 'var(--white)' : 'var(--cream)';
    html += `<div style="background:${bg};padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;">
      <span style="font-size:17px;">${item.icon}</span>
      <div style="font-size:12px;font-weight:500;color:var(--ink);">${item.name[currentLang]}</div>
    </div>`;
    html += `<div style="background:${bg};padding:8px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;">`;
    months.forEach((_,i) => {
      const active = i>=item.start && i<=item.end;
      const isNow = i===now && active;
      html += `<div style="flex:1;padding:0 2px;">${active?`<div style="height:20px;border-radius:4px;background:${isNow?item.color:'rgba(0,0,0,0.07)'};${isNow?`outline:2px solid ${item.color};`:''}"></div>`:''}</div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  html += `<div style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--ink-muted);">
    <div style="width:18px;height:4px;border-radius:2px;background:var(--petal-dark);"></div>
    ${t('cal_now_label')} (${months[now]})
  </div>`;
  grid.innerHTML = html;
}

async function subscribeEmail() {
  const email = document.getElementById('sub-email').value.trim();
  const msgEl = document.getElementById('sub-msg');
  if (!email || !email.includes('@')) return;

  if (FIREBASE_ENABLED && db) {
    try {
      await db.collection('subscriptions').add({
        email,
        lang: currentLang,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      msgEl.textContent = t('sub_success');
      msgEl.style.color = 'var(--success)';

      msgEl.style.color = 'var(--danger)';
      msgEl.style.display = 'block';

    // Demo mode

/* ════════════════════════════════════════════════════════════
   REPORT FORM
   ════════════════════════════════════════════════════════════ */
function buildReportLocationSelect() {
  const sel = document.getElementById('rpt-location');
  if (!sel) return;
  const prev = sel.value;
  sel.innerHTML = `<option value="">${t('rpt_select_location')}</option>` +
    SPOTS.map(s => `<option value="${s.id}">${s.name[currentLang]}</option>`).join('');
  if (prev) sel.value = prev;
}

function buildReportStatusGrid() {
  const grid = document.getElementById('rpt-status-grid');
  if (!grid) return;
  const opts = [
    {val:'peak',    cls:'',          label: LANGS[currentLang].status.peak},
    {val:'soon',    cls:'s-soon',    label: LANGS[currentLang].status.soon},
    {val:'fading',  cls:'s-fading',  label: LANGS[currentLang].status.fading},
    {val:'ended',   cls:'s-ended',   label: LANGS[currentLang].status.ended},
    {val:'foliage', cls:'s-foliage', label: LANGS[currentLang].status.foliage},
  ];
  grid.innerHTML = opts.map(o =>
    `<div class="status-option ${o.cls}${o.val===selectedStatus?' selected':''}" onclick="selectStatus('${o.val}','${o.cls}',this)">${o.label}</div>`
  ).join('');
}

function selectStatus(val, cls, el) {
  selectedStatus = val;
  document.querySelectorAll('.status-option').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}

function onDragOver(e) { e.preventDefault(); document.getElementById('photo-drop').classList.add('dragover'); }
function onDrop(e) {
  e.preventDefault();
  document.getElementById('photo-drop').classList.remove('dragover');
  handlePhotoSelect(e.dataTransfer.files);
}

async function handlePhotoSelect(files) {
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    if (file.size > 5 * 1024 * 1024) continue;
    const dataUrl = await compressImage(file);
    selectedPhotos.push({file, dataUrl});
  }
  renderPhotoPreviews();
}

function renderPhotoPreviews() {
  const wrap = document.getElementById('photo-previews');
  wrap.innerHTML = selectedPhotos.map((p,i) =>
    `<div class="photo-preview-item">
      <img src="${p.dataUrl}">
      <button class="photo-remove" onclick="removePhoto(${i})">✕</button>
    </div>`
  ).join('');
}

function removePhoto(idx) {
  selectedPhotos.splice(idx, 1);
  renderPhotoPreviews();
}

async function submitReport() {
  const spotId = parseInt(document.getElementById('rpt-location').value);
  const note   = document.getElementById('rpt-note').value.trim();
  const name   = document.getElementById('rpt-name').value.trim();
  const toast  = document.getElementById('rpt-toast');
  const btn    = document.getElementById('rpt-submit');

  if (!spotId) { document.getElementById('rpt-location').focus(); return; }

  btn.disabled = true;

  const report = {
    spotId,
    status: selectedStatus,
    note,
    name: name || null,
    ts: Date.now(),
    photoUrl: selectedPhotos[0]?.dataUrl || null,
  };

  if (FIREBASE_ENABLED && db) {
    try {
      let photoUrl = null;
      if (selectedPhotos.length > 0 && storage) {
        const blob = await fetch(selectedPhotos[0].dataUrl).then(r => r.blob());
        const ref = storage.ref(`reports/${Date.now()}_${selectedPhotos[0].file.name}`);
        await ref.put(blob);
        photoUrl = await ref.getDownloadURL();
      }
      await db.collection('reports').add({
        ...report,
        photoUrl,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      showToast(toast, t('rpt_success'), 'success');
    } catch(e) {
      showToast(toast, t('rpt_error'), 'error');
      btn.disabled = false;
      return;
    }
  } else {
    // Demo: store locally
    communityReports.unshift(report);
    renderCommunityFeed();
    showToast(toast, t('rpt_success') + ' (demo — Firebase not connected)', 'success');
  }

  // Reset form
  document.getElementById('rpt-location').value = '';
  document.getElementById('rpt-note').value = '';
  document.getElementById('rpt-name').value = '';
  selectedPhotos = [];
  renderPhotoPreviews();
  selectedStatus = 'peak';
  buildReportStatusGrid();
  renderReportFeed();
  btn.disabled = false;
}

function showToast(el, msg, type) {
  el.textContent = msg;
  el.className = 'form-toast toast-' + type;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

/* ════════════════════════════════════════════════════════════
   REPORT FEED (right column of Report tab)
   ════════════════════════════════════════════════════════════ */
async function loadReportFeed() {
  if (!FIREBASE_ENABLED || !db) {
    renderReportFeed();
    return;
  }
  try {
    const snap = await db.collection('reports')
      .orderBy('createdAt','desc').limit(20).get();
    communityReports = snap.docs.map(d => ({
      ...d.data(),
      ts: d.data().createdAt?.toMillis() || Date.now()
    }));
    renderCommunityFeed();
    renderReportFeed();
  } catch(e) {
    renderReportFeed();
  }
}

function renderReportFeed() {
  const feed = document.getElementById('report-feed-list');
  if (!feed) return;
  if (communityReports.length === 0) {
    feed.innerHTML = `<div style="font-size:13px;color:var(--ink-faint);padding:12px 0;">${t('feed_empty')}</div>`;
    return;
  }
  feed.innerHTML = communityReports.map(r => {
    const spot = SPOTS.find(s=>s.id===r.spotId);
    const spotName = spot?.name[currentLang] || '?';
    const statusLabel = LANGS[currentLang].status[r.status] || r.status;
    const sp = {peak:'pill-peak', soon:'pill-soon', fading:'pill-fading', ended:'pill-ended'};
    return `<div style="display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);">
      <div class="report-thumb" style="width:56px;height:56px;flex-shrink:0;">
        ${r.photoUrl ? `<img src="${r.photoUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">` : `<span style="font-size:24px;">${spot?.icon||'🌸'}</span>`}
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px;">
          <span style="font-size:13px;font-weight:500;">${spotName}</span>
          <span class="pill ${sp[r.status]}" style="font-size:10px;padding:2px 7px;">${statusLabel}</span>
        </div>
        ${r.note ? `<div style="font-size:12px;color:var(--ink-muted);line-height:1.5;margin-bottom:3px;">${r.note}</div>` : ''}
        <div style="font-size:11px;color:var(--ink-faint);">${r.name || t('rpt_name_placeholder')} · ${timeAgo(r.ts)}</div>
      </div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════════════════════════
   WEATHER
   ════════════════════════════════════════════════════════════ */
async function fetchWeather() {
  try {
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=50.88&longitude=4.70&current=temperature_2m,precipitation_probability,windspeed_10m,weathercode&timezone=Europe/Brussels');
    const d = await res.json();
    const c = d.current;
    weatherCode = c.weathercode;
    document.getElementById('hdr-temp').textContent = Math.round(c.temperature_2m)+'°C';
    document.getElementById('w-temp').textContent = Math.round(c.temperature_2m);
    document.getElementById('w-rain').textContent = c.precipitation_probability;
    document.getElementById('w-wind').textContent = Math.round(c.windspeed_10m);
    updateWeatherDesc(weatherCode);
  } catch(e) {
    document.getElementById('hdr-desc').textContent = '—';
  }
}

function updateWeatherDesc(code) {
  const desc = LANGS[currentLang].weather_desc;
  const keys = Object.keys(desc).map(Number).sort((a,b)=>a-b);
  let label = desc[0];
  for (const k of keys) { if (code >= k) label = desc[k]; }
  document.getElementById('hdr-desc').textContent = label;
}

/* ════════════════════════════════════════════════════════════
   TABS & LANG
   ════════════════════════════════════════════════════════════ */
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if (btn) btn.classList.add('active');
  else {
    document.querySelectorAll('.nav-tab').forEach(b => {
      if (b.getAttribute('onclick') && b.getAttribute('onclick').includes(name)) b.classList.add('active');
    });
  }
  if (name==='map') setTimeout(()=>map.invalidateSize(), 80);
}

function setLang(lang, btn) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyLang();
}

  document.getElementById('firebase-notice').style.display = FIREBASE_ENABLED ? 'none' : 'block';

});
